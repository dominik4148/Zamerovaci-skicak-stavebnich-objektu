<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zaměřovací skicák</title>
<meta name="theme-color" content="#24324a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skicák">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen drafting app — top bar, tool rail on the left, paper canvas with a floating context bar, always-on side panel (edit tools / properties / display toggles). Single light "paper" look on purpose. */
:root{
  --paper:#fbfbf8; --ink:#1d2430; --ink-2:#5b6472; --line:#d9dcd4;
  --chrome:#f1f2ee; --panel:#ffffff; --active:#24324a; --active-ink:#ffffff; --focus:#7c4dff; --soft:#f6f4ff;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr auto;grid-template-areas:"top top top" "rail stage side"}
.top{grid-area:top;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--chrome);min-width:0;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.brand{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;margin-right:4px}
select,input,button{font:inherit;color:inherit}
.sk{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;max-width:170px}
.btn{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;font-size:14px;flex:none}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary,.btn.on{background:var(--active);color:var(--active-ink);border-color:var(--active)}
.btn.scale.on{background:#169a43;border-color:#169a43}
.btn.msel.on{background:#1c64f2;border-color:#1c64f2;color:#fff}
.btn.msel.all.on{background:#e8780c;border-color:#e8780c;color:#fff}
.btn.danger{color:#e03a3a}
.btn:focus-visible,.tool:focus-visible,.chip:focus-visible,.seg:focus-visible,.ebtn:focus-visible,.tgl:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.spacer{flex:1}
.chip{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none}
.chip.on{box-shadow:0 0 0 2px var(--ink)}
.chip.custom{background:conic-gradient(#e03a3a,#d9a400,#169a43,#1c64f2,#8b3fd9,#e03a3a);position:relative;overflow:hidden}
.chip.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rail{grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:6px 5px;padding-left:max(5px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--chrome);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tool{width:62px;padding:6px 2px 5px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10.5px;font-weight:600;color:var(--ink-2);flex:none}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--active);color:var(--active-ink)}
.tool .k{display:block;width:16px;height:3px;border-radius:2px}
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--paper)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ctx{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px rgba(29,36,48,.08);overflow-x:auto;scrollbar-width:none;z-index:2}
.ctx::-webkit-scrollbar{display:none}
.ctx .div{width:1px;align-self:stretch;background:var(--line);margin:0 2px;flex:none}
.seg{height:34px;min-width:40px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.seg svg{width:28px;height:20px;flex:none}
.seg.on{background:var(--active);color:var(--active-ink);border-color:var(--active)}
.hint{position:absolute;left:12px;bottom:12px;right:64px;pointer-events:none;font-size:13px;color:var(--ink-2);display:flex;justify-content:flex-start}
.hint span{background:rgba(251,251,248,.94);padding:6px 10px;border-radius:8px;border:1px solid var(--line);max-width:100%}
.hint.call span{background:#24324a;color:#fff;border-color:#24324a}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3;white-space:nowrap}
.toast.show{opacity:1}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.sidetab{position:absolute;right:0;top:50%;transform:translateY(-50%);width:16px;height:44px;padding:0;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:rgba(255,255,255,.95);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;box-shadow:-2px 0 6px rgba(29,36,48,.06)}
.sidetab svg{width:12px;height:12px}
.sidetab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app.side-off .side{display:none}
/* side panel */
.side{grid-area:side;width:318px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.side input{-webkit-user-select:text;user-select:text}
.sec{padding-block:12px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sec>h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec.edit{background:var(--chrome)}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ebtn{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;font-weight:600;cursor:pointer}
.ebtn svg{width:20px;height:20px;flex:none}
.ebtn.on{background:var(--focus);border-color:var(--focus);color:#fff}
.ebtn:disabled{opacity:.38;cursor:default}
.sec.props{flex:1 0 auto}
.empty{font-size:13px;color:var(--ink-2);line-height:1.45;margin:0}
.sec.vis{border-bottom:0;background:var(--chrome)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.tgl{display:flex;align-items:center;gap:8px;min-height:34px;border:0;background:none;padding:2px 0;font-size:13px;text-align:left;cursor:pointer;color:var(--ink)}
.tgl .sw{width:30px;height:18px;border-radius:9px;background:#c9ccc4;position:relative;flex:none;transition:background .15s}
.tgl .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl.on .sw{background:var(--active)}
.tgl.on .sw::after{transform:translateX(12px)}
.allbtn{margin-top:8px;width:100%}
.props h2{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.props .sub{font-size:12px;color:var(--ink-2);margin:0 0 12px}
.tag{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.f{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-bottom:10px;min-width:0}
.row2>*{min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.f input[type=text]{height:40px;border:1px solid var(--line);border-left:5px solid var(--kc,var(--line));border-radius:8px;padding:0 10px;font-family:var(--f-num);font-size:18px;font-weight:600;background:var(--panel);width:100%;min-width:0}
.f input:focus,.wt input:focus{outline:2px solid var(--focus);outline-offset:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wt{width:100%;border-collapse:collapse;margin:6px 0 12px}
.wt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:left;padding:4px}
.wt td{padding:3px 4px}
.wt td:first-child{font-family:var(--f-num);font-weight:700;font-size:15px;width:42px;color:var(--ink-2)}
.wt tr.hl td:first-child{color:var(--focus)}
.wt input{height:38px;width:100%;min-width:0;border:1px solid var(--line);border-left:5px solid var(--kc);border-radius:8px;padding:0 8px;font-family:var(--f-num);font-size:17px;font-weight:600}
.wt tr.hl input{background:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#169a43;border-radius:6px;padding:2px 6px;margin-left:4px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin:6px 0 14px}
.leg label{display:flex;align-items:center;gap:8px}
.leg input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.modal{position:fixed;inset:0;background:rgba(29,36,48,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:var(--panel);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:90%;overflow:auto;-webkit-user-select:text;user-select:text}
.card h3{margin:0 0 6px;font-size:17px}
.card h4{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.card img{width:100%;border:1px solid var(--line);border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.card textarea{width:100%;height:160px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start;height:44px}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu2 .btn{justify-content:flex-start;height:44px}
@media (max-width:760px){
  .sidetab{top:auto;bottom:0;right:auto;left:50%;transform:translateX(-50%) rotate(90deg);transform-origin:center;margin-bottom:-14px}
  .app{grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top top" "rail stage" "side side"}
  .side{width:auto;max-height:36vh;border-left:0;border-top:1px solid var(--line)}
  .tool{width:52px;font-size:9.5px}
  .brand,.lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,.tgl .sw,.tgl .sw::after{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="brand">Skicák</span>
    <select class="sk" id="sketchSel" aria-label="Výkres"></select>
    <button class="btn" id="newSketch" title="Nový výkres" aria-label="Nový výkres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="btn" id="undo" title="Zpět" aria-label="Zpět"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn" id="redo" title="Znovu" aria-label="Znovu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="btn" id="fingerBtn" title="Kreslení prstem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 013 0v5"/><path d="M12 10V4a1.5 1.5 0 013 0v6"/><path d="M15 10V6a1.5 1.5 0 013 0v7a7 7 0 01-7 7h-.5a6 6 0 01-4.6-2.2L3.5 14.5a1.5 1.5 0 012.3-1.9L9 15"/></svg><span class="lbl" id="fingerLbl">Prst posouvá</span></button>
    <button class="btn scale" id="scaleBtn" title="Kreslení v měřítku"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l12-12 6 6-12 12z"/><path d="M7 11l2 2M10 8l2 2M13 5l2 2"/></svg><span class="lbl" id="scaleLbl">Měřítko vyp.</span></button>
    <button class="btn msel" id="selMarksBtn" title="Výběr kresby a textů obdélníkem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="1" stroke-dasharray="3 3"/><path d="M7 15c2-4 3 1 5-2s3-3 5-2"/></svg><span class="lbl">Výběr kresby</span></button>
    <button class="btn msel all" id="selAllBtn" title="Výběr všeho obdélníkem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="1" stroke-dasharray="3 3"/><path d="M7 16V9h6v3h4v4z" fill="currentColor" fill-opacity=".35"/></svg><span class="lbl">Výběr všeho</span></button>
    <span class="spacer"></span>
    <button class="btn" id="backupBtn" title="Záloha a načtení"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 01-.6-10A6 6 0 0118 9a4 4 0 01-1 9"/><path d="M12 12v9M9 15l3-3 3 3"/></svg><span class="lbl">Záloha</span></button>
    <button class="btn" id="settingsBtn" title="Nastavení výkresu" aria-label="Nastavení výkresu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export</button>
  </header>

  <nav class="rail" id="rail" aria-label="Nástroje"></nav>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ctx" id="ctx" hidden></div>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hintWrap"><span id="hint"></span></div>
    <button class="sidetab" id="sideTab" aria-label="Skrýt panel" title="Skrýt panel"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2l4 4-4 4"/></svg></button>
    <div class="zoom">
      <button class="btn" id="fitBtn" title="Zobrazit vše" aria-label="Zobrazit vše"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </main>

  <aside class="side" id="side">
    <section class="sec edit" aria-label="Úpravy prvku"><h3>Úpravy prvku</h3><div class="egrid" id="editGrid"></div></section>
    <section class="sec props" id="props"></section>
    <section class="sec vis" aria-label="Zobrazení"><h3>Zobrazení</h3><div class="tgrid" id="visGrid"></div><button class="btn allbtn" id="allLabels"></button></section>
  </aside>
</div>

<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>
<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>

<script>
(()=>{
'use strict';
/* ================= config ================= */
const PAL=[
  {c:'#1b1f24',n:'Černá'},{c:'#8d9199',n:'Šedá'},{c:'#1c64f2',n:'Modrá – vzdálenosti'},{c:'#169a43',n:'Zelená – výšky'},
  {c:'#d9a400',n:'Žlutá – tloušťky'},{c:'#e03a3a',n:'Červená'},{c:'#8b3fd9',n:'Fialová'}
];
const MEANING={'#1c64f2':'vzdálenost','#169a43':'výška','#d9a400':'tloušťka'};
const BLUE='#1c64f2',GREEN='#169a43',YELLOW='#d9a400',INK='#1d2430',BG='#fbfbf8',VIOLET='#7c4dff';
const WALL_W=14, STEP=13, STAIR_W=44, GAP=4, MM=25; // MM = millimetres per drawing unit (approx.)
const OPEN_W={door:36,window:46,pass:40,niche:34};
const CORNER_TOL=13, AXIS_TOL=20, DEG=Math.PI/180;
const DASH={solid:[],dash:[10,6],dot:[1.5,5],dashdot:[14,5,2,5]};
const DASH_N={solid:'plná',dash:'čárkovaná',dot:'tečkovaná',dashdot:'čerchovaná'};
const WID={thin:1.3,mid:2.2,thick:3.8},WID_N={thin:'tenká',mid:'střední',thick:'silná'};
const LS_KEY='zamereni-skicak.v1';
const VIS_DEF={roomNames:true,wallIds:true,wallVals:true,openIds:true,openVals:true,itemIds:true,itemVals:true,texts:true,drawings:true,grid:true};
const VIS_N=[['roomNames','Názvy místností'],['wallIds','Označení stěn'],['wallVals','Hodnoty stěn'],['openIds','Označení otvorů'],['openVals','Hodnoty otvorů'],['itemIds','Označení schodů, komínů, sloupů'],['itemVals','Hodnoty schodů, komínů, sloupů'],['texts','Texty a čísla'],['drawings','Ruční kresba'],['grid','Mřížka']];
const LABEL_KEYS=['roomNames','wallIds','wallVals','openIds','openVals','itemIds','itemVals','texts'];
const DEF_SET={unit:'mm',paper:'A4',colWall:'#8d9199',colWin:'#f28c18',colDoor:'#e03a3a',colPass:'#8b3fd9',colNiche:'#0e8f88',colStair:'#2f4b7c',colChim:'#4a4f57',
  fingerDraw:null,scaleMode:false,sideCollapsed:false,drawColor:'#1b1f24',drawDash:'solid',drawWidth:'mid',stairType:'straight',stairRef:'C',passArch:false,nicheArch:false,colShape:'round',doorKind:'swing',vis:null};

/* ================= state ================= */
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function blankSketch(name){return {id:uid(),name,created:Date.now(),rooms:[],openings:[],items:[],marks:[],view:null}}
function sampleSketch(){
  const s=blankSketch('Ukázka (můžeš smazat)');
  const r={id:uid(),name:'Obývák',closed:true,pts:[[-200,-140],[160,-140],[160,20],[260,20],[260,160],[-200,160]],height:'2650',th:'300',walls:[]};
  r.walls=r.pts.map(()=>({len:'',th:''}));
  ['4500','2000','1250','1750','5750','3750'].forEach((v,i)=>r.walls[i].len=v);

/* ================= hit testing ================= */
function hitAll(p,{rooms=true}={}){

    if(it.kind==='stair'){if(it.type==='spiral'){if(dist(p,it.c)<it.r+tol*.3)return {type:'item',id:it.id}}else{const G=stairGeom(it);for(let i=0;i<G.arrow.length-1;i++)if(segDist(p,G.arrow[i],G.arrow[i+1]).d<stairW(it)/2+tol*.3)return {type:'item',id:it.id}}}
    else if(dist(p,it.p)<itemRadius(it)*1.3+tol*.6)return {type:'item',id:it.id};
  }
  let best=null,bd=tol;
  for(const m of S.marks){
    if(m.kind==='text'?!ST.vis.texts:!ST.vis.drawings)continue;
    let d;if(m.kind==='text')d=dist(p,m.a)-8/view.s;else{const sp=sampleDraw(m);d=sp.length===1?dist(p,sp[0]):1e9;for(let i=0;i<sp.length-1;i++)d=Math.min(d,segDist(p,sp[i],sp[i+1]).d)}

  }
  if(best||!rooms)return best;
  for(const it of S.items)if(it.kind==='photo'&&Math.abs(p[0]-it.p[0])<=it.w/2&&Math.abs(p[1]-it.p[1])<=it.h/2)best={type:'item',id:it.id};
  if(best){const ph=best;best=null;for(const r of S.rooms)edgesOf(r).forEach(([a,b],i)=>{const d=segDist(p,a,b).d;if(d<bd){bd=d;best={type:'room',id:r.id,edge:i}}});return best||ph}
  for(const r of S.rooms)edgesOf(r).forEach(([a,b],i)=>{const d=segDist(p,a,b).d;if(d<bd){bd=d;best={type:'room',id:r.id,edge:i}}});
  return best;
}
function nearestEdge(p,maxD,excl){

/* ================= object helpers (move / rotate / copy / mirror) ================= */

/* ================= scale mode: wall length ================= */

  const e=edgesOf(r)[i];if(!e)return;const [a,b]=e,L=dist(a,b),nL=toU(mm),d=nL-L;if(Math.abs(d)<1e-4||L<1e-6)return;

  }

  const base={id:e.pointerId,ptype:e.pointerType,start:sp,last:sp,t0:performance.now(),moved:0,w0:wp};
  if(marquee){

    const gb=multiSel.length?groupBox():null;
    if(gb&&inBox(wp,gb)){act={...base,kind:'group',op:groupOp,pushed:false};return}

  }
  if(sel&&editMode!=='rotate'&&editMode!=='mirror'&&(e.pointerType==='touch'||tool==='select'||editMode==='move')){
    const vk=vertexHandleAt(sp);if(vk!=null){act={...base,kind:'vertex',k:vk,pushed:false};return}

  }

    const hk=labelHandleAt(sp);if(hk){act={...base,kind:'label',key:hk,lo0:getLo(hk).slice(),pushed:false};return}
  }

  if(tool==='wall'||tool==='line'){
    const wall=tool==='wall';const snapA=wall?snapInfo(wp):null;
    act={...base,kind:'stroke',wall,pts:[wp],straight:false,anchor:sp,snapA,scaled:ST.scaleMode};

let editKey=null;
function onEdit(inp,fn,onCommit){
  if(!inp)return;
  inp.addEventListener('focus',()=>{editKey=null});

  if(onCommit)inp.addEventListener('change',()=>{onCommit();save();draw()});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=[...propsEl.querySelectorAll('input[type=text]')];const i=all.indexOf(inp);if(all[i+1])all[i+1].focus();else inp.blur()}});
}
function bindSide(){
  const $=id=>document.getElementById(id);
  $('desel').onclick=()=>{editMode=null;select(null)};
  if($('lo_reset'))$('lo_reset').onclick=()=>{pushUndo();selLabelKeys().forEach(k=>setLo(k,undefined));save();renderSide();draw()};
  const btn=(id,fn)=>{const b=$(id);if(b)b.onclick=()=>{pushUndo();fn();save();renderSide();draw()}};
  if(sel.type==='room'){

    onEdit($('r_name'),v=>r.name=v);onEdit($('r_h'),v=>r.height=v);

      r.walls[i]=r.walls[i]||{len:'',th:''};
      onEdit($(`w_len_${i}`),v=>r.walls[i].len=v,()=>applyScaleLen(r,i));
      onEdit($(`w_th_${i}`),v=>r.walls[i].th=v);
      ['len','th'].forEach(k=>$(`w_${k}_${i}`).addEventListener('focus',()=>{sel.edge=i;propsEl.querySelectorAll('.wt tr').forEach(tr=>tr.classList.toggle('hl',tr.dataset.i==String(i)));draw()}));
    });
    $('r_straight').onclick=()=>{
      pushUndo();const before=S.openings.filter(o=>o.room===r.id).map(o=>({o,p:openingGeom(o).c}));
      const np=orthogonalize(r.closed?r.pts.concat([r.pts[0]]):r.pts,r.closed,4,S.rooms.length>1?globalTheta():null);
      if(!np){toast('Nejde narovnat');return}
      const old=r.walls,same=old.length===(r.closed?np.length:np.length-1);r.pts=np;r.walls=edgesOf(r).map((e,i)=>same?old[i]:{len:'',th:''});
      if(!same&&old.some(w=>w.len||w.th))toast('Počet stěn se změnil – zkontroluj délky');
      before.forEach(({o,p})=>{let bd=1e9;edgesOf(r).forEach(([a,b],i)=>{const s=segDist(p,a,b);if(s.d<bd){bd=s.d;o.edge=i;o.t=Math.max(.06,Math.min(.94,s.t))}})});
      save();renderSide();draw();
    };
    $('r_del').onclick=()=>removeObj({type:'room',id:r.id});
  }
  if(sel.type==='opening'){
    const o=getObj(sel);
    [['o_w','w'],['o_h','h'],['o_sill','sill'],['o_depth','depth'],['o_spring','spring'],['o_crown','crown'],['o_note','note']].forEach(([id,k])=>onEdit($(id),v=>o[k]=v));
    btn('o_flip',()=>o.flip=!o.flip);btn('o_mirror',()=>o.mirror=!o.mirror);btn('o_side',()=>o.side=-(o.side||1));btn('o_arch',()=>o.arch=!o.arch);
    if($('o_dk'))$('o_dk').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{pushUndo();o.dk=b.dataset.k;save();renderSide();draw()});
    $('o_del').onclick=()=>removeObj({type:'opening',id:o.id});
  }
  if(sel.type==='item'){
    const it=getObj(sel);
    [['i_w','w'],['i_n','n'],['i_h','h'],['i_b','b'],['i_dim','dim'],['i_flue','flueDim'],['i_d','d'],['i_cw','w'],['i_cl','l'],['i_note','note']].forEach(([id,k])=>onEdit($(id),v=>it[k]=v));
    btn('i_rev',()=>it.rev=!it.rev);
    $('i_del').onclick=()=>removeObj({type:'item',id:it.id});
  }
  if(sel.type==='mark'){
    const m=getObj(sel);
    onEdit($('m_text'),v=>m.text=v);
    $('m_cols').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{pushUndo();m.color=b.dataset.c;save();renderSide();draw()});
    if($('m_wid'))$('m_wid').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{pushUndo();m.width=WID[b.dataset.w];save();renderSide();draw()});
    if($('m_dash'))$('m_dash').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{pushUndo();m.dash=b.dataset.d;save();renderSide();draw()});
    $('m_del').onclick=()=>removeObj({type:'mark',id:m.id});
  }
}

const MSEL_COL={marks:'#1c64f2',all:'#e8780c'};
function elemPoints(h){
  const o=getObj(h);if(!o)return [];
  if(h.type==='room')return o.pts;
  if(h.type==='opening'){const g=openingGeom(o);return g?[g.j1,g.j2]:[]}
  if(h.type==='item'){
    if(o.kind==='stair')return o.type==='spiral'?[add(o.c,[-o.r,-o.r]),add(o.c,[o.r,o.r])]:stairGeom(o).outline;
    if(o.kind==='photo')return rectPts(o.p,0,o.w,o.h);
    const r=itemRadius(o);return [add(o.p,[-r,-r]),add(o.p,[r,r])];
  }

}
function pruneMulti(){multiSel=multiSel.filter(h=>getObj(h))}
function groupBox(){pruneMulti();const pts=[];multiSel.forEach(h=>pts.push(...elemPoints(h)));if(!pts.length)return null;const b=bboxOf(pts),m=8/view.s;return {x0:b.x0-m,y0:b.y0-m,x1:b.x1+m,y1:b.y1+m}}
function inBox(p,b){return b&&p[0]>=b.x0&&p[0]<=b.x1&&p[1]>=b.y0&&p[1]<=b.y1}
function marqueeSelect(a,b){
  const r={x0:Math.min(a[0],b[0]),x1:Math.max(a[0],b[0]),y0:Math.min(a[1],b[1]),y1:Math.max(a[1],b[1])};
  const inside=h=>{const pts=elemPoints(h);return pts.length&&pts.every(p=>inBox(p,r))};
  const out=[];
  S.marks.forEach(m=>{if(m.kind==='text'?!ST.vis.texts:!ST.vis.drawings)return;const h={type:'mark',id:m.id};if(inside(h))out.push(h)});
  if(marquee==='all'){
    S.rooms.forEach(o=>{const h={type:'room',id:o.id};if(inside(h))out.push(h)});
    S.openings.forEach(o=>{const h={type:'opening',id:o.id};if(inside(h))out.push(h)});
    S.items.forEach(o=>{const h={type:'item',id:o.id};if(inside(h))out.push(h)});
  }
  return out;
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  if((e.key==='Delete'||e.key==='Backspace')&&sel)removeObj(sel);

});

  E(0,'ENDSEC',0,'EOF');
  return out.join('\r\n')+'\r\n';
}

const RND=p=>p.map(v=>Math.round(v));
function exportData(){
  const out={format:'zamereni-skica/3',nazev:S.name,datum:new Date().toISOString().slice(0,10),jednotky:ST.unit,
    upozorneni:'Náčrt. Souřadnice (x doprava, y dolů) určují polohu a návaznost prvků; prvky označené v_meritku=true jsou kreslené přibližně v měřítku (1 jednotka ≈ 25 mm). Stěny jsou kreslené v ose. Rozhodující jsou zapsané rozměry; prázdný řetězec = neměřeno. Ručně psané poznámky jsou jen na obrázku.',
    legenda:{stena:ST.colWall,okno:ST.colWin,dvere:ST.colDoor,prostup:ST.colPass,nika:ST.colNiche,schodiste:ST.colStair,komin:ST.colChim,modra:'vzdálenosti',zelena:'výšky',zluta:'tloušťky'},
    mistnosti:[],otvory:[],schodiste:[],kominy:[],sloupy:[],kresba:[],texty:[]};
  const wallId={};

    const rid='M'+(ri+1);const R={id:rid,nazev:r.name,typ:r.closed?'místnost (uzavřený obrys)':'samostatná stěna / příčka',v_meritku:!!r.scaled,svetla_vyska:r.height,tloustka_sten:r.th,vrcholy:r.pts.map(RND),steny:[]};
    edgesOf(r).forEach(([a,b],i)=>{
      const d=sub(b,a),an=Math.abs(angOf(d))/DEG;const o=(an<3||an>177)?'vodorovná':Math.abs(an-90)<3?'svislá':'šikmá';
      const id=rid+'-S'+(i+1);wallId[r.id+':'+i]=id;
      R.steny.push({id,od:RND(a),do:RND(b),orientace_na_nacrtu:o,delka:(r.walls[i]||{}).len||'',tloustka:(r.walls[i]||{}).th||r.th||''});
    });

  });
  const oids=openingIds(S);
  S.openings.forEach(o=>{
    const g=openingGeom(o);if(!g)return;
    const O={id:oids[o.id],typ:OPEN_NAME(o).toLowerCase(),stena:wallId[o.room+':'+o.edge],poloha_na_stene:Math.round(o.t*100)/100,stred:RND(g.c),sirka:o.w};
    if(o.type==='door'){O.typ_dveri=DOOR_KIND[o.dk||'swing'].toLowerCase();O.vyska=o.h;O.otevirani=g.r.closed?(o.flip?'ven z místnosti':'do místnosti'):(o.flip?'strana B':'strana A');O.zavesy=o.mirror?'u konce stěny (bod "do")':'u začátku stěny (bod "od")'}
    if(o.type==='door'){const k=o.dk||'swing';if(k!=='swing')delete O.zavesy;if(k==='double')O.otevirani=O.otevirani;if(k.startsWith('slide')){O.kridlo_na_strane=O.otevirani.replace('do místnosti','uvnitř místnosti').replace('ven z místnosti','vně místnosti');delete O.otevirani;if(k==='slide')O.smer_posunu=o.mirror?'k začátku stěny (bod "od")':'ke konci stěny (bod "do")'}}
    if(o.type==='window'){O.vyska=o.h;O.parapet=o.sill}
    if(o.type==='pass'){if(o.arch){O.vyska_paty_klenby=o.spring;O.vyska_vrcholu_klenby=o.crown}else O.vyska=o.h}
    if(o.type==='niche'){O.hloubka=o.depth;O.parapet=o.sill;O.strana=g.r.closed?((o.side||1)*dot(g.nE,g.n)>0?'z vnitřní strany místnosti':'z vnější strany'):((o.side||1)>0?'strana A':'strana B');if(o.arch){O.vyska_paty_klenby=o.spring;O.vyska_vrcholu_klenby=o.crown}else O.vyska=o.h}
    O.poznamka=o.note;out.otvory.push(O);
  });
  const iids=itemIds(S);
  S.items.forEach(it=>{
    if(it.kind==='stair'){const o={id:iids[it.id],typ:STAIR_NAME[it.type],sirka_ramene:it.w,pocet_stupnu:it.n,vyska_stupne:it.h,sirka_stupne:it.b,poznamka:it.note};
      if(it.type==='spiral'){o.stred=RND(it.c);o.polomer_na_nacrtu=Math.round(it.r)}else{const G=stairGeom(it);o.osa_vystupu=G.arrow.map(RND);o.smer='od prvního bodu osy nahoru';o.referencni_cara={L:'schodiště vlevo od čáry',C:'čára v ose',R:'schodiště vpravo od čáry'}[it.ref]}
      out.schodiste.push(o)}
    if(it.kind==='chimney')out.kominy.push({id:iids[it.id],umisteni:it.inWall?'průduch ve stěně':'volně stojící komín',poloha:RND(it.p),rozmer_kominu:it.dim||'',rozmer_pruduchu:it.flueDim,poznamka:it.note});
    if(it.kind==='photo')(out.fotky=out.fotky||[]).push({poloha:RND(it.p),poznamka:it.note||'',info:'fotka je jen v obrázku / PDF'});
    if(it.kind==='column')out.sloupy.push({id:iids[it.id],tvar:it.shape==='round'?'kruhový':'čtvercový',poloha:RND(it.p),prumer:it.shape==='round'?it.d:undefined,sirka:it.shape==='square'?it.w:undefined,delka:it.shape==='square'?it.l:undefined,poznamka:it.note});
  });
  let k=0,t=0;
  S.marks.forEach(m=>{
    const base={barva:m.color,vyznam:MEANING[m.color]||'',typ_cary:DASH_N[m.dash]||'plná'};
    if(m.kind==='text'){out.texty.push({id:'T'+(++t),poloha:RND(m.a),text:m.text,barva:m.color,vyznam:base.vyznam});return}
    const e={id:'C'+(++k),...base};
    if(m.g==='path'){e.tvar='volná kresba / ručně psaný text';const b=bboxOf(m.pts);e.oblast=[[Math.round(b.x0),Math.round(b.y0)],[Math.round(b.x1),Math.round(b.y1)]]}
    else if(m.g==='poly'){e.tvar=m.closed?(m.pts.length===4?'obdélník / čtyřúhelník':m.pts.length===3?'trojúhelník':'mnohoúhelník'):(m.pts.length===2?'úsečka':'lomená čára');e.body=m.pts.map(RND)}
    else if(m.g==='circle'){e.tvar='kruh';e.stred=RND(m.c);e.polomer=Math.round(m.r)}
    else if(m.g==='ellipse'){e.tvar='elipsa';e.stred=RND(m.c);e.poloosy=[Math.round(m.rx),Math.round(m.ry)]}
    else if(m.g==='quad'){e.tvar='oblouk (parabola)';e.od=RND(m.a);e.do=RND(m.b);e.ridici_bod=RND(m.ctrl)}
    else if(m.g==='semi'){e.tvar='půlkruh';e.prumer_od=RND(m.a);e.prumer_do=RND(m.b)}
    out.kresba.push(e);
  });
  return out;
}
function renderPNG(){
  const b=bounds();const pad=130;
  const bw=b?Math.max(b.x1-b.x0,100):400,bh=b?Math.max(b.y1-b.y0,100):300;
  const s=Math.min(2.6,Math.max(.6,1800/Math.max(bw,bh)));
  const w=Math.round(bw*s+pad*2),head=96,h=Math.round(bh*s+pad*2)+head;
  const c=document.createElement('canvas');const K=Math.max(.5,Math.min(2,Math.sqrt(1.1e7/(w*h))));c.width=Math.round(w*K);c.height=Math.round(h*K);const x=c.getContext('2d');x.scale(K,K);
  drawScene(x,{s,ox:pad-(b?b.x0:0)*s,oy:head+pad-(b?b.y0:0)*s},w,h,{});
  const ff=getComputedStyle(document.documentElement).getPropertyValue('--f-ui');
  x.textAlign='left';x.fillStyle=INK;x.font=`700 22px ${ff}`;x.textBaseline='top';x.fillText(S.name,24,22);
  x.font=`500 14px ${ff}`;x.fillStyle='#5b6472';x.fillText(`${new Date().toLocaleDateString('cs-CZ')} · rozměry v ${ST.unit} · náčrt`,24,52);
  const leg=[[ST.colWall,'stěna'],[ST.colWin,'okno'],[ST.colDoor,'dveře'],[ST.colPass,'prostup'],[ST.colNiche,'nika'],[ST.colStair,'schodiště'],[BLUE,'vzdálenost'],[GREEN,'výška'],[YELLOW,'tloušťka']];
  let lx=24,ly=74;leg.forEach(([col,n])=>{x.font=`600 12px ${ff}`;const tw=x.measureText(n).width;if(lx+tw+30>w-24){lx=24;ly+=18}x.fillStyle=col;x.fillRect(lx,ly,11,11);x.fillStyle=INK;x.fillText(n,lx+15,ly-1);lx+=tw+32});
  return c;
}
const safeName=()=>(S.name||'vykres').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').slice(0,60);
let dl=null;
async function getDl(){
  if(dl)return dl;
  const typeOf=n=>n.endsWith('.pdf')?'application/pdf':n.endsWith('.png')?'image/png':n.endsWith('.zip')?'application/zip':'application/json';
  const fileOf=(filename,data)=>new File([data],filename,{type:typeOf(filename)});
  const viaLink=f=>{const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)};
  const share=async f=>{try{await navigator.share({files:[f]});return true}catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};if(e&&e.name==='NotAllowedError')return 'gesture';throw e}};
  dl={save:async({filename,data})=>{
    const f=fileOf(filename,data);
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      const r=await share(f);if(r===true)return;
      // the tap "expired" while the file was being prepared – ask for one more tap
      await new Promise((res,rej)=>{const b=document.createElement('button');b.className='btn primary';b.style.marginTop='10px';b.textContent='Klepni pro uložení: '+filename;
        b.onclick=async()=>{b.remove();try{const r2=await share(f);r2===true?res():(viaLink(f),res())}catch(e){rej(e)}};
        b.style.width='100%';b.style.height='48px';b.style.margin='4px 0 12px';
        const card=document.getElementById('modalCard'),open=!document.getElementById('modal').hidden;
        if(open){card.insertBefore(b,card.children[1]||null);b.scrollIntoView({block:'center'})}else{b.style.position='fixed';b.style.left='50%';b.style.bottom='24px';b.style.transform='translateX(-50%)';b.style.zIndex='30';b.style.width='auto';document.body.appendChild(b)}
        try{toast('Soubor je připravený – klepni na tlačítko Uložit')}catch(e){}});
      return;
    }
    viaLink(f);
  }};
  return dl;
}
