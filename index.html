<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Zápisník</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e222b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zápisník">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="home">
  <aside id="side">
    <div class="side-head"><button id="b-settings" class="ibtn" title="Nastavení" aria-label="Nastavení"></button></div>
    <label class="search"><input id="search" type="search" placeholder="Hledat" autocomplete="off"></label>
    <div id="tree"></div>
  </aside>
  <main id="main">
    <div class="main-head">
      <div id="crumbs"></div>
      <button id="b-sort" class="hbtn" title="Řazení"><span>Název</span></button>
      <button id="b-select" class="hbtn" title="Vybrat"><span>Vybrat</span></button>
      <button id="b-new" class="newbtn"><span>Nový</span></button>
    </div>
    <div class="title-row"><button id="title-dot" title="Změnit barvu složky" hidden></button><h1 id="title"></h1></div>
    <div id="list"></div>
    <div id="selbar" hidden></div>
  </main>
</div>

<div id="dropline" hidden></div>
<div id="editor" hidden>
  <div id="stage"><canvas id="cv"></canvas><canvas id="live"></canvas></div>
  <div id="overlay">
    <div id="selframe" hidden><i class="h tl"></i><i class="h tr"></i><i class="h br"></i><i class="h bl"></i><i class="rot"></i></div>
    <div id="cropframe" hidden><i class="c tl"></i><i class="c tr"></i><i class="c br"></i><i class="c bl"></i><i class="e et"></i><i class="e er"></i><i class="e eb"></i><i class="e el"></i>
      <div class="crop-btns"><button id="crop-no" title="Zrušit ořez"></button><button id="crop-ok" title="Potvrdit ořez"></button></div></div>
    <i id="lh1" class="lh" hidden></i><i id="lh2" class="lh" hidden></i>
    <div id="selmenu" hidden></div>
    <button id="addpage"><span>Přidat stránku</span></button>
  </div>
  <button id="b-back" class="pill sq" title="Zpět na složky" aria-label="Zpět"></button>
  <div id="tb" class="pill"><div id="tools"></div><div id="sub"></div></div>
  <div id="tr" class="pill">
    <button id="b-undo" class="tbtn" title="Krok zpět"></button><button id="b-redo" class="tbtn" title="Krok vpřed"></button>
    <button id="b-export" class="tbtn" title="Export a sdílení"></button><button id="b-nbset" class="tbtn" title="Nastavení sešitu a papíru"></button>
    <button id="b-pages" class="tbtn" title="Všechny stránky"></button>
  </div>
  <button id="pg-menu" class="pill round" title="Možnosti stránky"></button>
  <div id="pg-ind" class="pill"><button id="pg-up" title="Předchozí stránka"></button><span id="pg-cur">1</span><i></i><span id="pg-tot">1</span><button id="pg-dn" title="Další stránka"></button></div>
  <aside id="pg-panel" hidden><div class="pg-head">Všechny stránky</div><div id="pg-list"></div><div id="pg-bar"></div></aside>
  <aside id="ins-panel" hidden>
    <div class="ins-head"><button id="ins-cancel" class="link">Zrušit</button><b>Vložit</b><button id="ins-add" class="link add" disabled>Přidat</button></div>
    <div class="ins-btns">
      <button id="ins-gallery"><span>Fotky z galerie a alb</span></button>
      <button id="ins-camera"><span>Vyfotit</span></button>
      <button id="ins-pdf"><span>PDF ze Souborů (vloží se za tuto stránku)</span></button>
    </div>
    <p id="ins-hint" class="hint">Vyber až 10 fotek. Otevře se výběr fotek iPadu, kde jsou i tvoje alba. Vybrané fotky se tady ukážou a tlačítkem Přidat se vloží doprostřed stránky.</p>
    <div id="ins-grid"></div>
  </aside>
</div>
<script src="lib/pdf-lib.min.js"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/geom.js"></script>
<script src="js/shapes.js"></script>
<script src="js/text.js"></script>
<script src="js/render.js"></script>
<script src="js/pdfio.js"></script>
<script src="js/home.js"></script>
<script src="js/editor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
